<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Review helper</title>
<style>
:root{--bg:#f6f8fa;--paper:#ffffff;--ink:#1f2328;--muted:#59636e;--line:#d1d9e0;--accent:#0969da;--accent-bg:#ddf4ff;--add:#dafbe1;--add-ink:#1a7f37;--del:#ffebe9;--del-ink:#cf222e;--code:#f6f8fa;--warn:#9a6700;--warn-bg:#fff8c5;--bad:#d1242f;--bad-bg:#ffebe9;--target:#fff8c5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--paper:#151b23;--ink:#e6edf3;--muted:#9198a1;--line:#2f3742;--accent:#4493f8;--accent-bg:#12233a;--add:#12261e;--add-ink:#3fb950;--del:#2d1517;--del-ink:#f85149;--code:#11161d;--warn:#d29922;--warn-bg:#2b230f;--bad:#f85149;--bad-bg:#2d1517;--target:#3b3214}}
:root[data-theme="dark"]{--bg:#0d1117;--paper:#151b23;--ink:#e6edf3;--muted:#9198a1;--line:#2f3742;--accent:#4493f8;--accent-bg:#12233a;--add:#12261e;--add-ink:#3fb950;--del:#2d1517;--del-ink:#f85149;--code:#11161d;--warn:#d29922;--warn-bg:#2b230f;--bad:#f85149;--bad-bg:#2d1517;--target:#3b3214}
*{box-sizing:border-box}
:root{--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
a{color:var(--accent)}
code,pre,.mono,.path{font-family:var(--mono);font-size:12.5px}
.skip{position:absolute;left:-9999px}.skip:focus{left:8px;top:8px;background:var(--paper);padding:6px 10px;z-index:9}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{padding:22px 32px 0;border-bottom:1px solid var(--line);background:var(--paper)}
h1,h2,h3{letter-spacing:-.015em;font-weight:650}h1{margin:4px 0 2px;font-size:26px}h2{margin:6px 0 10px;font-size:21px}h3{margin:22px 0 8px;font-size:16px}
.eyebrow{text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:13px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin:8px 0 12px;font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs a{padding:8px 14px;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;text-decoration:none;color:var(--muted)}
.tabs a[aria-current]{background:var(--bg);border-color:var(--line);color:var(--ink);font-weight:600}
.tabs span{margin-left:6px;padding:0 7px;border-radius:9px;background:var(--accent-bg);color:var(--accent);font-size:12px}
.workspace{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:calc(100vh - 160px)}
.workspace.wide{grid-template-columns:minmax(0,1fr)}.workspace.wide aside{display:none}
.workspace.files main{max-width:none}
body.side-off .workspace.files{grid-template-columns:minmax(0,1fr)}body.side-off .workspace.files aside{display:none}
body.wrap .diff td{white-space:pre-wrap;overflow-wrap:anywhere}
aside{border-right:1px solid var(--line);padding:16px;background:var(--paper);position:sticky;top:0;max-height:100vh;overflow:auto}
aside input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);margin:4px 0 10px}
.group{margin:18px 0 6px;font-size:13px;font-weight:650;color:var(--ink)}.group span{color:var(--muted);font-weight:500;margin-right:6px}
.file-link{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:6px;text-decoration:none;color:var(--ink)}
.file-link:hover{background:var(--code)}
.file-link[aria-current]{background:var(--accent-bg)}
.file-link .fn{display:block;font-family:var(--mono);font-size:12.5px;font-weight:600;overflow-wrap:anywhere}
.file-link .ft{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;line-height:1.4;color:var(--muted)}
.file-link .st{font-family:var(--mono);font-size:11px;width:12px;flex:none;color:var(--muted)}
main{padding:26px 36px 60px;max-width:1180px;min-width:0}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.card h3{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.why{border-left:3px solid var(--accent);background:var(--accent-bg);padding:10px 14px;border-radius:0 8px 8px 0}
.snapshot{background:var(--warn-bg);color:var(--warn);padding:6px 12px;border-radius:6px;font-size:13px;margin:0 0 14px}
.btn{display:inline-flex;align-items:center;padding:6px 11px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font:inherit;font-size:13px;cursor:pointer;text-decoration:none;margin:0 6px 6px 0}
.btn[aria-pressed="true"]{background:var(--accent-bg);border-color:var(--accent)}
.tag{display:inline-block;padding:1px 8px;border-radius:9px;font-size:12px;background:var(--accent-bg);color:var(--accent)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.neutral{background:var(--code);color:var(--muted);border:1px solid var(--line)}
.diff-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--paper);margin-top:12px}
.hunk-note{margin:18px 0 0;padding:9px 13px;border-left:3px solid var(--accent);background:var(--accent-bg);border-radius:0 8px 8px 0;font-size:14px}
.hunk-note+.diff-wrap{margin-top:6px}
.cbtn{display:none}.can-comment .cbtn{display:inline-flex}.hunk>.cbtn{margin:14px 0 0}.cbtn.inline{padding:0 8px;font-size:12px;margin:0 0 0 6px}.can-comment .hunk>.diff-wrap,.can-comment .hunk>.cbtn+.hunk-note{margin-top:6px}
table.diff{border-collapse:collapse;min-width:100%;font-family:var(--mono);font-size:12.5px;line-height:1.5}
.diff td{padding:0 10px;white-space:pre;vertical-align:top}
.diff .ln{width:1px;min-width:3.5em;text-align:right;color:var(--muted);user-select:none;border-right:1px solid var(--line)}.diff .ln a{color:inherit;text-decoration:none}
.diff .sg{width:1px;padding-right:0;user-select:none}
.diff tr.add{background:var(--add)}.diff tr.add .sg{color:var(--add-ink)}
.diff tr.del{background:var(--del)}.diff tr.del .sg{color:var(--del-ink)}
.diff tr.hunk td{background:var(--code);color:var(--muted);padding:4px 10px;border-bottom:1px solid var(--line)}
.diff tr.meta td{color:var(--muted);font-style:italic}
.diff tr.target{background:var(--target)!important}
.notice{padding:10px 14px;border:1px dashed var(--line);border-radius:8px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0 20px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-size:22px}.stat span{font-size:12.5px;color:var(--muted)}
.list{padding-left:20px}.list li{margin:7px 0}.overview{font-size:15.5px}
.order{counter-reset:o;list-style:none;padding:0}.order li{counter-increment:o;margin:6px 0}
.order li::before{content:counter(o);display:inline-block;width:22px;height:22px;margin-right:8px;border-radius:50%;background:var(--accent-bg);color:var(--accent);text-align:center;font-size:12px;line-height:22px}
.comment{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:12px 0}
.comment.target{box-shadow:0 0 0 2px var(--accent)}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
pre.block{background:var(--code);border:1px solid var(--line);border-radius:6px;padding:10px;white-space:pre-wrap;overflow-wrap:anywhere}
dl.facts{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px}dl.facts dt{color:var(--muted)}dl.facts dd{margin:0;overflow-wrap:anywhere}
#mobile-files{display:none}
@media(max-width:800px){header{padding:16px 16px 0}h1{font-size:22px}.workspace{grid-template-columns:1fr}aside{display:none;position:static;max-height:60vh;border-right:0;border-bottom:1px solid var(--line)}aside.open{display:block}#mobile-files{display:inline-flex}#side-toggle{display:none}main{padding:18px 16px 40px}.cards{grid-template-columns:1fr}}
</style></head><body>
<a class="skip" href="#main">Skip to review content</a>
<header><div class="eyebrow">Review helper · frozen snapshot</div><h1 id="title"></h1><div class="muted" id="subtitle"></div><div class="meta" id="meta"></div><nav class="tabs" id="tabs" aria-label="Review views"></nav></header>
<div class="workspace" id="workspace"><aside id="sidebar" aria-label="File browser"><label class="small muted" for="search">Find a file</label><input id="search" type="search" placeholder="path, title, or topic"><div id="file-list"></div></aside><main id="main" tabindex="-1"></main></div>
<script id="snapshot" type="application/json">/*__SNAPSHOT__*/</script>
<script>
const D=JSON.parse(document.getElementById('snapshot').textContent),$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const paras=s=>String(s||'').split(/\n\s*\n/).map(p=>`<p>${esc(p)}</p>`).join('');
const bytes=b=>Uint8Array.from(atob(b||''),c=>c.charCodeAt(0));
const dec=new TextDecoder();
D.files.forEach((f,i)=>{f.idx=i;f.bytes=bytes(f.patch64);f.patch=dec.decode(f.bytes)});
const byPath=Object.fromEntries(D.files.map(f=>[f.path,f]));
const ordered=D.groups.flatMap(g=>D.files.filter(f=>f.group===g));
const route=(p)=>'#'+new URLSearchParams(Object.entries(p).filter(([,v])=>v!==undefined&&v!=='')).toString();
const fileRoute=(path,side,line)=>route({tab:'files',file:path,side:line?side||'new':'',line:line||''});
const target=t=>{const f=byPath[t.file];if(!f)return esc(t.label||t.file);return `<a href="${esc(fileRoute(t.file,t.side,t.line))}" title="${esc(t.file+(t.line?':'+t.line:''))}">${esc(t.label||t.file.split('/').pop()+(t.line?':'+t.line:''))}</a>`};
const slug=p=>'file-'+p.replace(/[^A-Za-z0-9]+/g,'-');
const statusMark={added:'A',deleted:'D',renamed:'R',copied:'C',modified:'M'};
const statusTag=s=>{s=String(s||'unknown').toLowerCase();const cls=/fail|open|unresolved|not /.test(s)?'bad':/pend|unknown|partial|skip/.test(s)?'warn':/pass|done|resolved|implemented|fixed/.test(s)?'':'neutral';return `<span class="tag ${cls}">${esc(s)}</span>`};
let blobUrls=[];
function download(bytesArr,name,label){const u=URL.createObjectURL(new Blob([bytesArr],{type:'text/x-diff'}));blobUrls.push(u);return `<a class="btn" href="${u}" download="${esc(name)}">${esc(label)}</a>`}

$('#title').textContent=D.title;document.title=D.title+' · Review helper';$('#subtitle').textContent=D.subtitle||'';
const adds=D.files.reduce((a,f)=>a+f.adds,0),dels=D.files.reduce((a,f)=>a+f.deletes,0);
$('#meta').innerHTML=[`<span class="mono">${esc(D.repo)} · ${esc(D.branch)}</span>`,`<span class="mono">${esc(String(D.base).slice(0,10))} → ${esc(String(D.head).slice(0,10))}</span>`,`<span>${D.files.length} files · +${adds} / −${dels}</span>`,`<span>Captured ${esc(String(D.captured).replace('T',' ').slice(0,16))} UTC</span>`,safeUrl(D.pr_url)?`<a href="${esc(safeUrl(D.pr_url))}" rel="noopener" target="_blank">Pull request</a>`:''].join('');
const tabs=[['summary','Summary',''],['files','Files',D.files.length],['comments','Review comments',D.comments.length],['scope','Verification & scope','']];
function nav(tab){$('#tabs').innerHTML=tabs.map(([id,label,n])=>`<a href="${route({tab:id})}" ${id===tab?'aria-current="page"':''}>${esc(label)}${n!==''?`<span>${n}</span>`:''}</a>`).join('')}

let search='',current=null;
function sidebar(){const q=search;$('#file-list').innerHTML=D.groups.map(g=>{const fs=D.files.filter(f=>f.group===g&&[f.path,f.title,f.why].some(x=>String(x).toLowerCase().includes(q)));return fs.length?`<div class="group"><span>${D.groups.indexOf(g)+1}.</span>${esc(g)}</div>`+fs.map(f=>`<a class="file-link" href="${esc(fileRoute(f.path))}" title="${esc(f.path)}" ${current===f?'aria-current="page"':''}><span class="st" aria-label="${f.status}">${statusMark[f.status]||'M'}</span><span><span class="fn">${esc(f.path.split('/').pop())}</span><span class="ft">${esc(f.title)}</span></span></a>`).join(''):''}).join('')||'<p class="small muted">No matching files.</p>'}
$('#search').addEventListener('input',e=>{search=e.target.value.toLowerCase();sidebar()});

function summaryView(){
  const count=(xs,k)=>xs.reduce((m,x)=>(m[x[k]||'unknown']=(m[x[k]||'unknown']||0)+1,m),{});
  const st=count(D.files,'status'),cs=count(D.comments,'disposition'),ks=count(D.checks,'status');
  const stat=(n,l)=>`<div class="stat"><b>${n}</b><span>${esc(l)}</span></div>`;
  const items=(xs,k)=>xs.length?`<ul class="list">${xs.map((t,n)=>`<li id="summary-${k}-${n}" data-comment-target>${esc(t.text)}${t.file?` <span class="small">— ${target(t)}</span>`:''}<button class="btn cbtn inline" data-comment>Comment</button></li>`).join('')}</ul>`:'<p class="muted">None recorded.</p>';
  const s=D.summary||{};
  $('#main').innerHTML=`<div class="snapshot">Snapshot captured ${esc(String(D.captured).replace('T',' ').slice(0,16))} UTC. It does not follow later edits.</div>
  <div class="eyebrow">Summary</div><h2>What this change does</h2>${Array.isArray(s.overview)?`<ul class="list overview">${s.overview.map((x,n)=>`<li id="summary-overview-${n}" data-comment-target>${esc(x)}<button class="btn cbtn inline" data-comment>Comment</button></li>`).join('')}</ul>`:paras(s.overview)}
  <div class="stats">${stat(D.files.length,Object.entries(st).map(([k,v])=>v+' '+k).join(' · '))}${stat('+'+adds+' / −'+dels,'lines added / removed')}${stat(D.comments.length,D.comments.length?Object.entries(cs).map(([k,v])=>v+' '+k).join(' · '):'review comments')}${stat(D.checks.length,D.checks.length?Object.entries(ks).map(([k,v])=>v+' '+k).join(' · '):'checks recorded')}</div>
  <h3>Main changes</h3>${items(s.changes||[],'changes')}
  <h3>Where to look hardest</h3>${items(s.focus||[],'focus')}
  <h3>Suggested review order</h3><ol class="order">${D.groups.map(g=>{const fs=D.files.filter(f=>f.group===g);return fs.length?`<li><a href="${esc(fileRoute(fs[0].path))}">${esc(g)}</a> <span class="small muted">${fs.length} file${fs.length>1?'s':''}</span></li>`:''}).join('')}</ol>
  ${(D.notes||[]).length?`<h3>Notes</h3><ul class="list">${D.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}`}

function parsePatch(f){let o=0,n=0,inHunk=false;return f.patch.replace(/\n$/,'').split('\n').map(s=>{const m=s.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);if(m){o=+m[1];n=+m[2];inHunk=true;return{kind:'hunk',text:s}}
  if(s.startsWith('diff '))inHunk=false;
  if(!inHunk)return{kind:'meta',text:s};
  if(s.startsWith('+'))return{kind:'add',text:s.slice(1),new:n++};if(s.startsWith('-'))return{kind:'del',text:s.slice(1),old:o++};if(s.startsWith('\\'))return{kind:'meta',text:s};
  return{kind:'ctx',text:s.slice(1),old:o++,new:n++}})}
const ln=(f,side,n)=>n?`<a href="${esc(fileRoute(f.path,side,n))}" id="${side}-${n}">${n}</a>`:'';
function diffTable(f,side,line,full){
  if(f.binary)return '<p class="notice">Binary file: no text diff. Download the exact patch below.</p>';
  // git's header lines repeat the path shown above, so they are dropped; the download keeps them.
  const rows=parsePatch(f).filter(r=>!(r.kind==='meta'&&/^(diff --git|index |--- |\+\+\+ )/.test(r.text)));
  const ti=line?rows.findIndex(r=>r[side]===line):-1,limit=full||ti>=400?rows.length:400;
  const row=r=>{const cls=r.kind+(line&&r[side]===line?' target':''),sign={add:'+',del:'−',ctx:''}[r.kind];
    return r.kind==='hunk'||r.kind==='meta'?`<tr class="${cls}"><td colspan="4">${esc(r.text)}</td></tr>`:`<tr class="${cls}"><td class="ln">${ln(f,'old',r.old)}</td><td class="ln">${ln(f,'new',r.new)}</td><td class="sg" aria-hidden="true">${sign}</td><td>${esc(r.text)}</td></tr>`};
  const blocks=[];rows.slice(0,limit).forEach(r=>{if(r.kind==='hunk'||!blocks.length)blocks.push({note:r.kind==='hunk'?(f.annotations||[]).find(a=>a.header&&r.text.startsWith(a.header)):null,rows:[]});blocks.at(-1).rows.push(r)});
  const body=blocks.map((b,n)=>`<section class="hunk" id="${esc(slug(f.path))}-hunk-${n}" data-comment-target><button class="btn cbtn" data-comment>Comment</button>${b.note?`<p class="hunk-note">${esc(b.note.note)}</p>`:''}<div class="diff-wrap"><table class="diff" aria-label="Diff of ${esc(f.path)}"><tbody>${b.rows.map(row).join('')}</tbody></table></div></section>`).join('');
  const more=limit<rows.length?`<p><a class="btn" href="${esc(route({tab:'files',file:f.path,full:1}))}">Show all ${rows.length} diff rows</a></p>`:'';
  return body+more}
function sourceTable(f,side,line){const src=f[side];if(src==null)return `<p class="notice">No ${side} text for this file (absent at that endpoint, or binary).</p>`;
  return `<div class="diff-wrap"><table class="diff" aria-label="Captured ${side} source"><tbody>${src.replace(/\n$/,'').split('\n').map((s,i)=>`<tr class="ctx${i+1===line?' target':''}"><td class="ln">${ln(f,side,i+1)}</td><td>${esc(s)}</td></tr>`).join('')}</tbody></table></div>`}

function filesView(p){
  const f=byPath[p.get('file')]||ordered[0]||D.files[0];current=f;sidebar();
  const side=p.get('side')==='old'?'old':'new',line=+p.get('line')||0,full=p.has('full');
  let view=p.get('view')==='source'?'source':'diff',outside=false;
  if(line&&view==='diff'&&!f.binary&&!parsePatch(f).some(r=>r[side]===line)){view='source';outside=true}
  const i=ordered.indexOf(f),prev=ordered[i-1],next=ordered[i+1];
  const related=D.comments.filter(c=>(c.evidence||[]).some(t=>t.file===f.path)||c.file===f.path);
  $('#main').innerHTML=`<button class="btn" id="mobile-files" aria-expanded="false">Browse files</button>
  <section id="${esc(slug(f.path))}" data-comment-target><div class="eyebrow">${esc(f.group)} · file ${i+1} of ${ordered.length}</div><h2>${esc(f.title)}</h2>
  <div><code class="path">${esc(f.path)}</code> <span class="tag neutral">${esc(f.status)}</span>${f.old_path?` <span class="small muted">from <code>${esc(f.old_path)}</code></span>`:''} <span class="small muted">+${f.adds} / −${f.deletes}</span></div>
  <div class="cards"><section class="card"><h3>Before</h3>${paras(f.before)}</section><section class="card"><h3>After</h3>${paras(f.after)}</section></div>
  <div class="why"><b>Why / what to review.</b> ${paras(f.why)}</div><button class="btn cbtn" data-comment style="margin-top:8px">Comment on this file</button></section>
  ${related.length?`<h3>Related review comments</h3><ul class="list">${related.map(c=>`<li><a href="${esc(route({tab:'comments',comment:c.id}))}">${esc(c.concern)}</a> ${statusTag(c.disposition)}</li>`).join('')}</ul>`:''}
  <p style="margin-top:16px">${prev?`<a class="btn" href="${esc(fileRoute(prev.path))}">← ${esc(prev.title)}</a>`:''}${next?`<a class="btn" href="${esc(fileRoute(next.path))}">${esc(next.title)} →</a>`:''}
  <a class="btn" href="${esc(route({tab:'files',file:f.path,view:'diff'}))}" aria-pressed="${view==='diff'}">Diff</a><a class="btn" href="${esc(route({tab:'files',file:f.path,view:'source',side,line:line||''}))}" aria-pressed="${view==='source'}">Source</a>
  <button class="btn" id="copy">Copy path</button><button class="btn" id="side-toggle" aria-pressed="${!document.body.classList.contains('side-off')}">Files list</button><button class="btn" id="wrap-toggle" aria-pressed="${document.body.classList.contains('wrap')}">Wrap lines</button>${download(f.bytes,f.path.replaceAll('/','__')+'.patch','Download exact patch')}<span id="flash" class="small muted" role="status"></span></p>
  ${outside?`<p class="notice">${side} line ${line} is outside the diff; showing the captured ${side} source.</p>`:''}
  ${view==='diff'?diffTable(f,side,line,full):sourceTable(f,side,line)}`;
  $('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(f.path);$('#flash').textContent='Copied'}catch{$('#flash').textContent=f.path}};
  for(const [id,cls,inv] of [['#side-toggle','side-off',true],['#wrap-toggle','wrap',false]])$(id).onclick=e=>{const on=document.body.classList.toggle(cls);e.target.setAttribute('aria-pressed',on!==inv);savePrefs()};
  $('#mobile-files').onclick=e=>{const o=$('#sidebar').classList.toggle('open');e.target.setAttribute('aria-expanded',o)};
  if(line)requestAnimationFrame(()=>document.querySelector('tr.target')?.scrollIntoView({block:'center'}))}

function commentCard(c,sel){const url=safeUrl(c.url);return `<article class="comment${sel?' target':''}" id="comment-${esc(c.id)}" data-comment-target>
  <div>${statusTag(c.disposition)} <span class="small muted">remote: ${esc(c.remote||'unknown')}</span>${c.location?` <span class="small muted">· ${esc(c.location)}</span>`:''}</div>
  <h3>${esc(c.concern)}<button class="btn cbtn inline" data-comment>Comment</button></h3>${paras(c.explanation)}
  ${(c.evidence||[]).length?`<p class="small">Evidence: ${c.evidence.map(target).join(' · ')}</p>`:''}
  ${c.body?`<details><summary>Original ${c.author?'from '+esc(c.author):''}</summary><pre class="block">${esc(c.body)}</pre>${url?`<a href="${esc(url)}" rel="noopener" target="_blank">Open original</a>`:''}</details>`:''}</article>`}
function commentsView(p){current=null;sidebar();const sel=p.get('comment');
  const pr=D.comments.filter(c=>c.source!=='conversation'),conv=D.comments.filter(c=>c.source==='conversation');
  $('#main').innerHTML=`<div class="eyebrow">Traceability</div><h2>Review comments</h2><p class="muted small">Local disposition and remote thread state are tracked separately; an unknown remote state is not assumed resolved.</p>
  ${pr.length?pr.map(c=>commentCard(c,c.id===sel)).join(''):'<p class="notice">No review comments in scope.</p>'}
  ${conv.length?`<h3>Conversation decisions</h3>${conv.map(c=>commentCard(c,c.id===sel)).join('')}`:''}`;
  if(sel)requestAnimationFrame(()=>document.getElementById('comment-'+sel)?.scrollIntoView({block:'center'}))}

function scopeView(){current=null;sidebar();const all=new Uint8Array(D.files.reduce((a,f)=>a+f.bytes.length,0));let o=0;D.files.forEach(f=>{all.set(f.bytes,o);o+=f.bytes.length});
  $('#main').innerHTML=`<div class="eyebrow">Provenance &amp; limits</div><h2>Verification &amp; scope</h2>
  <dl class="facts">${[['Comparison',D.comparison],['Repository',D.root],['Branch',D.branch],['Base',D.base],['Head',D.head],['Captured',D.captured],['Fingerprint',D.fingerprint],['Files',D.files.length]].map(([k,v])=>`<dt>${k}</dt><dd class="mono">${esc(v)}</dd>`).join('')}</dl>
  <p>${download(all,'complete.diff','Download complete patch')}</p>
  <h3>Checks</h3>${D.checks.length?D.checks.map((c,n)=>`<article class="comment" id="check-${n}" data-comment-target><div>${statusTag(c.status)} <span class="small muted">${esc(c.date||'')}${c.revision?' · '+esc(c.revision):''}</span></div><h3>${esc(c.title)}<button class="btn cbtn inline" data-comment>Comment</button></h3>${c.command?`<pre class="block">${esc(c.command)}</pre>`:''}${paras(c.limits)}${c.log?`<details><summary>Captured log</summary><pre class="block">${esc(c.log)}</pre></details>`:''}</article>`).join(''):'<p class="notice">No checks recorded for this snapshot.</p>'}
  ${(D.excluded||[]).length?`<details><summary>Excluded files · ${D.excluded.length}</summary><ul class="list">${D.excluded.map(x=>`<li class="path">${esc(x)}</li>`).join('')}</ul></details>`:''}`}

function render(){blobUrls.forEach(u=>URL.revokeObjectURL(u));blobUrls=[];
  const p=new URLSearchParams(location.hash.slice(1)),tab=p.get('tab')||(p.has('file')?'files':'summary');
  nav(tab);$('#workspace').classList.toggle('wide',tab==='summary');$('#workspace').classList.toggle('files',tab==='files');
  ({summary:summaryView,files:filesView,comments:commentsView,scope:scopeView}[tab]||summaryView)(p)}
// Viewer conveniences only; the page works when storage is unavailable.
const PREFS='review-helper:prefs';
function savePrefs(){try{localStorage.setItem(PREFS,JSON.stringify({sideOff:document.body.classList.contains('side-off'),wrap:document.body.classList.contains('wrap')}))}catch{}}
try{const q=JSON.parse(localStorage.getItem(PREFS)||'{}');document.body.classList.toggle('side-off',!!q.sideOff);document.body.classList.toggle('wrap',!!q.wrap)}catch{}
window.addEventListener('hashchange',render);render();
let comments=null;
window.claude?.use?.('comments').then(c=>{if(c){comments=c;document.body.classList.add('can-comment')}});
$('#main').addEventListener('click',async e=>{const el=e.target.closest('[data-comment]')?.closest('[data-comment-target]');if(!el||!comments)return;
  try{await comments.openComposer({element:el})}catch(err){if(err?.code!=='rate_limited'){comments=null;document.body.classList.remove('can-comment')}}});
</script></body></html>
